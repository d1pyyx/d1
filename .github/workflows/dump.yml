name: dump
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: fetch input from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern dump_input.zip
          unzip -q dump_input.zip -d in
          ls -la in
      - name: get dumper
        run: git clone --depth 1 https://github.com/Perfare/Il2CppDumper
      - name: dump
        run: |
          mkdir -p out
          cd Il2CppDumper/Il2CppDumper
          (echo | dotnet run -c Release -- "$GITHUB_WORKSPACE/in/libil2cpp.so" "$GITHUB_WORKSPACE/in/global-metadata.dat" "$GITHUB_WORKSPACE/out") || true
          ls -la "$GITHUB_WORKSPACE/out"
          test -f "$GITHUB_WORKSPACE/out/dump.cs"
      - uses: actions/upload-artifact@v4
        with:
          name: il2cpp-dump
          path: |
            out/dump.cs
            out/script.json
            out/il2cpp.h
            
